<div class="reset-password-container">
    <form class="reset-password" (submit)="onResetPassword(); $event.preventDefault()">
        <h2>Reset Password </h2>
        <label>Email:</label>
        <input [(ngModel)]="email" name="email" type="email" required />

        <label>New Password:</label>
        <input [(ngModel)]="newPassword" name="newPassword" type="password" required />

        <label>Confirm Password:</label>
        <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required />

        <button type="submit">Reset Password</button>

        <a routerLink = "/login">Back to Login </a>
    </form>
</div>
